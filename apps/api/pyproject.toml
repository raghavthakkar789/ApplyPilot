[project]
name = "applypilot-api"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
  "alembic==1.15.2",
  "argon2-cffi==23.1.0",
  "fastapi==0.115.12",
  "psycopg[binary]==3.2.6",
  "pydantic-settings==2.8.1",
  "pydantic==2.11.1",
  "pymupdf==1.28.2",
  "python-docx==1.2.0",
  "python-multipart==0.0.32",
  "sqlalchemy==2.0.40",
  "uvicorn[standard]==0.34.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "mypy==1.15.0",
  "pytest==8.3.5",
  "pytest-asyncio==0.26.0",
  "ruff==0.11.2",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/applypilot"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
