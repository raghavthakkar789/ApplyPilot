name: applypilot

services:
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8000
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    networks: [edge, private]

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: runtime
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://applypilot:replace-with-a-local-random-password@postgres:5432/applypilot}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "applypilot.healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks: [private]

  api-debug:
    profiles: [debug]
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: runtime
    environment:
      APP_ENV: development
      LOG_LEVEL: DEBUG
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://applypilot:replace-with-a-local-random-password@postgres:5432/applypilot}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [private]

  api-test:
    profiles: [test]
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: test
    environment:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://applypilot_test:test-only-password@postgres-test:5432/applypilot_test
    depends_on:
      postgres-test:
        condition: service_healthy
    networks: [private]
    command: ["sh", "-c", "alembic upgrade head && pytest -q -p no:cacheprovider"]

  worker:
    build:
      context: ./apps/worker
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "applypilot_worker.healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks: [private]

  migrate:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: runtime
    command: ["alembic", "upgrade", "head"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://applypilot:replace-with-a-local-random-password@postgres:5432/applypilot}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [private]

  postgres:
    image: postgres:17.4-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-applypilot}
      POSTGRES_USER: ${POSTGRES_USER:-applypilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace-with-a-local-random-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [private]

  postgres-test:
    profiles: [test]
    image: postgres:17.4-bookworm
    environment:
      POSTGRES_DB: applypilot_test
      POSTGRES_USER: applypilot_test
      POSTGRES_PASSWORD: test-only-password
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U applypilot_test -d applypilot_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks: [private]

networks:
  edge:
  private:
    internal: true

volumes:
  postgres-data:
